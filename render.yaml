services:
  - type: web
    name: openclaw
    env: docker
    plan: free
    region: oregon
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured
    envVars:
      - key: HOME
        value: /tmp
      - key: TMPDIR
        value: /tmp
      - key: OPENCLAW_HOME
        value: /tmp
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: PORT
        value: "10000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: OPENCLAW_CONFIG
        value: '{"plugins":{"enabled":false},"diagnostics":{"memory":{"thresholdRatio":2.5}}}'
      - key: OPENCLAW_DISABLE_UPDATE_CHECK
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
