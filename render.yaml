services:
  - type: web
    name: openclaw
    env: docker
    plan: free
    region: oregon
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8080
